name: Deploy Backend with SAM

on:
  push:
    branches:
      - main
    paths:
      - 'scatterpilot/infrastructure/**'
      - 'scatterpilot/functions/**'
      - 'scatterpilot/layers/**'
      - '.github/workflows/deploy-backend.yml'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

env:
  AWS_REGION: 'us-east-1'
  SAM_TEMPLATE: 'scatterpilot/infrastructure/template.yaml'
  STACK_NAME: 'scatterpilot-vm-staging'

jobs:
  build-and-deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    # Prevent concurrent deployments
    concurrency:
      group: backend-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: SAM Build
        run: sam build --template-file ${{ env.SAM_TEMPLATE }}

      # TODO: Ensure the following secrets are set in GitHub repo settings
      #   (Settings → Secrets and variables → Actions → New repository secret):
      #   - AWS_ACCESS_KEY_ID
      #   - AWS_SECRET_ACCESS_KEY
      #   - SAM_ARTIFACTS_BUCKET
      #   - STRIPE_SECRET_KEY           (sk_test_... or sk_live_...)
      #   - STRIPE_WEBHOOK_SECRET       (whsec_... for subscription events)
      #   - STRIPE_PAYMENT_WEBHOOK_SECRET (whsec_... for Connect payment events)
      #   - STRIPE_PRICE_SOLO_MONTHLY   (price_...)
      #   - STRIPE_PRICE_SOLO_ANNUAL    (price_...)
      #   - STRIPE_PRICE_PRO_MONTHLY    (price_...)
      #   - STRIPE_PRICE_PRO_ANNUAL     (price_...)
      #   - STRIPE_PRICE_AGENCY_MONTHLY (price_...)
      #   - STRIPE_PRICE_AGENCY_ANNUAL  (price_...)
      - name: SAM Deploy
        run: |
          sam deploy \
            --stack-name scatterpilot-vm-staging \
            --region us-east-1 \
            --s3-bucket ${{ secrets.SAM_ARTIFACTS_BUCKET }} \
            --s3-prefix scatterpilot-vm-staging \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              ParameterKey=Environment,ParameterValue=staging \
              ParameterKey=StripeSecretKey,ParameterValue=${{ secrets.STRIPE_SECRET_KEY }} \
              ParameterKey=StripeWebhookSecret,ParameterValue=${{ secrets.STRIPE_WEBHOOK_SECRET }} \
              ParameterKey=StripePaymentWebhookSecret,ParameterValue=${{ secrets.STRIPE_PAYMENT_WEBHOOK_SECRET }} \
              ParameterKey=FrontendUrl,ParameterValue=https://scatterpilot.com \
              ParameterKey=StripePriceSoloMonthly,ParameterValue=${{ secrets.STRIPE_PRICE_SOLO_MONTHLY }} \
              ParameterKey=StripePriceSoloAnnual,ParameterValue=${{ secrets.STRIPE_PRICE_SOLO_ANNUAL }} \
              ParameterKey=StripePriceProMonthly,ParameterValue=${{ secrets.STRIPE_PRICE_PRO_MONTHLY }} \
              ParameterKey=StripePriceProAnnual,ParameterValue=${{ secrets.STRIPE_PRICE_PRO_ANNUAL }} \
              ParameterKey=StripePriceAgencyMonthly,ParameterValue=${{ secrets.STRIPE_PRICE_AGENCY_MONTHLY }} \
              ParameterKey=StripePriceAgencyAnnual,ParameterValue=${{ secrets.STRIPE_PRICE_AGENCY_ANNUAL }}

      - name: Deployment summary
        run: |
          echo "## Backend Deployment Complete! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Stack:** \`${{ env.STACK_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** \`${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** \`staging\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Stack Outputs" >> $GITHUB_STEP_SUMMARY
          aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs' \
            --output table >> $GITHUB_STEP_SUMMARY || echo "Could not fetch outputs" >> $GITHUB_STEP_SUMMARY
