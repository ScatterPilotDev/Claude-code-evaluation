<!--
  ScatterPilot Open Graph image — 1200×630
  TODO: Convert to PNG for production OG usage.
        Run: npx svgexport logo-og.svg logo-og.png 1200:630
        Or use: https://cloudconvert.com/svg-to-png
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FAFBF9"/>

  <!-- Subtle grid pattern for visual interest -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E5DE" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>

  <!-- Logo mark centered — 96×96 at (552, 215) -->
  <g transform="translate(552, 215)">
    <rect width="96" height="96" rx="21" fill="#4A6741"/>
    <!-- Top bar -->
    <rect x="30" y="16.5" width="48" height="15" rx="5" fill="white"/>
    <!-- Middle bar -->
    <rect x="18" y="40.5" width="48" height="15" rx="5" fill="white"/>
    <!-- Bottom bar -->
    <rect x="30" y="64.5" width="48" height="15" rx="5" fill="white"/>
  </g>

  <!-- Wordmark: "ScatterPilot" centered below mark -->
  <text
    x="600"
    y="356"
    font-family='"DM Sans", system-ui, -apple-system, sans-serif'
    font-size="52"
    font-weight="600"
    letter-spacing="-0.5"
    text-anchor="middle"
  >
    <tspan fill="#1A2318">Scatter</tspan><tspan fill="#4A6741">Pilot</tspan>
  </text>

  <!-- Tagline -->
  <text
    x="600"
    y="418"
    font-family='"DM Sans", system-ui, -apple-system, sans-serif'
    font-size="24"
    font-weight="400"
    fill="#8A9484"
    letter-spacing="0.2"
    text-anchor="middle"
  >AI-Powered Invoicing</text>

  <!-- Bottom accent line -->
  <rect x="560" y="455" width="80" height="3" rx="2" fill="#4A6741" opacity="0.4"/>
</svg>
