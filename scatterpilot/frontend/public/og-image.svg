<!--
  ScatterPilot Open Graph image — 1200×630
  Design tokens: sage-500=#4A6741  sage-50=#F4F7F3  ink-primary=#1A2318
                 ink-secondary=#5F6B5A  ink-tertiary=#8A9484  surface-bg=#FAFBF9
                 border=#E2E5DE

  TODO: Convert to PNG for full social-platform compatibility (LinkedIn, Slack, etc.)
        Option A: npx sharp-cli og-image.svg -o public/og-image.png -w 1200 -h 630
        Option B: https://cloudconvert.com/svg-to-png
        Option C: Add a Vite build plugin (vite-plugin-svg2png) to auto-generate on build
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">

  <!-- ── Background ─────────────────────────────────────────────────────────── -->
  <rect width="1200" height="630" fill="#FAFBF9"/>

  <!-- ── Subtle decorative oval — sage-50, adds depth without clutter ───────── -->
  <ellipse cx="600" cy="315" rx="380" ry="260" fill="#F4F7F3"/>

  <!-- ── Very faint dot grid for texture ────────────────────────────────────── -->
  <defs>
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#CEDCC9" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.4"/>

  <!-- ── Logo mark — 96×96 geometric S-form, centered at (600, 232) ─────────── -->
  <!-- viewBox 0 0 32 32 scaled to 96px → scale factor 3 -->
  <g transform="translate(552, 184)">
    <!-- Background rounded square -->
    <rect width="96" height="96" rx="21" fill="#4A6741"/>
    <!-- Top bar  — right-aligned  → x 30–78 (10×3 – 26×3) -->
    <rect x="30"  y="16.5" width="48" height="15" rx="6" fill="#FFFFFF"/>
    <!-- Middle bar — left-aligned   → x 18–66 ( 6×3 – 22×3) -->
    <rect x="18"  y="40.5" width="48" height="15" rx="6" fill="#FFFFFF"/>
    <!-- Bottom bar — right-aligned  → x 30–78 -->
    <rect x="30"  y="64.5" width="48" height="15" rx="6" fill="#FFFFFF"/>
  </g>

  <!-- ── "ScatterPilot" wordmark — DM Sans 600, 52px ────────────────────────── -->
  <text
    x="600"
    y="348"
    font-family='"DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
    font-size="52"
    font-weight="600"
    letter-spacing="-0.5"
    text-anchor="middle"
  >
    <tspan fill="#1A2318">Scatter</tspan><tspan fill="#4A6741">Pilot</tspan>
  </text>

  <!-- ── Tagline — DM Sans 400, 22px ───────────────────────────────────────── -->
  <text
    x="600"
    y="394"
    font-family='"DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
    font-size="22"
    font-weight="400"
    fill="#5F6B5A"
    letter-spacing="0.1"
    text-anchor="middle"
  >AI-Powered Invoicing for Consultants &amp; Agencies</text>

  <!-- ── Separator line — 120px, centered ─────────────────────────────────── -->
  <line x1="540" y1="428" x2="660" y2="428" stroke="#E2E5DE" stroke-width="2" stroke-linecap="round"/>

  <!-- ── Domain — DM Sans 500, 17px, sage-500 ─────────────────────────────── -->
  <text
    x="600"
    y="460"
    font-family='"DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
    font-size="17"
    font-weight="500"
    fill="#4A6741"
    letter-spacing="0.3"
    text-anchor="middle"
  >scatterpilot.com</text>

</svg>
