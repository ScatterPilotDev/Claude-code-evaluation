  CreateInvoiceCheckoutLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ScatterPilot-CreateInvoiceCheckout-${Environment}
      RetentionInDays: 30

  GetPublicInvoiceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ScatterPilot-GetPublicInvoice-${Environment}
      RetentionInDays: 30

  PublicCheckoutLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ScatterPilot-PublicCheckout-${Environment}
      RetentionInDays: 30

  CreatePaymentLinkLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ScatterPilot-CreatePaymentLink-${Environment}
      RetentionInDays: 30

  PaymentWebhookLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ScatterPilot-PaymentWebhook-${Environment}
      RetentionInDays: 30

  StripeConnectAccountLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ScatterPilot-StripeConnectAccount-${Environment}
      RetentionInDays: 30

  StripeConnectStatusLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ScatterPilot-StripeConnectStatus-${Environment}
      RetentionInDays: 30

  StripeConnectDashboardLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ScatterPilot-StripeConnectDashboard-${Environment}
      RetentionInDays: 30

  DailyDigestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ScatterPilot-DailyDigest-${Environment}
      RetentionInDays: 30

  MarketingTasksLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ScatterPilot-MarketingTasks-${Environment}
      RetentionInDays: 30

  # ---------------------------------------------------------------------------
  # State Machines
  # ---------------------------------------------------------------------------
  ScatterPilotStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: statemachine/conversation_v2.asl.json
      DefinitionSubstitutions:
        ConversationsTable: !Ref ConversationsTable
        ScatterPilotMainTable: !Ref ScatterPilotMainTable
        CreateInvoiceFunction: !Ref CreateInvoiceFunction
      Type: EXPRESS
      Logging:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
      Policies:
        - Statement:
            - Sid: BedrockInvokePolicy
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
            - Sid: DynamoDBPutPolicy
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
              Resource:
                - !GetAtt ScatterPilotMainTable.Arn
                - !GetAtt ConversationsTable.Arn
            - Sid: LambdaInvokePolicy
              Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt CreateInvoiceFunction.Arn
      Tags:
        Environment: !Ref Environment
        Application: ScatterPilot

  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/vendedlogs/states/ScatterPilot-Conversation-V2-${Environment}
      RetentionInDays: 30

  # GetUserProfileLogGroup omitted — /aws/lambda/ScatterPilot-GetProfile-staging
  # already exists in AWS (auto-created by Lambda), not managed by CloudFormation.
  # UpdateUserProfileLogGroup omitted — same reason (ScatterPilot-UpdateProfile-staging).
  # GetStripeStatusLogGroup omitted — same reason (ScatterPilot-GetStripeStatus-staging).
  # StripeOAuthCallbackLogGroup omitted — same reason (ScatterPilot-StripeOAuthCallback-staging).

  DisconnectStripeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ScatterPilot-DisconnectStripe-${Environment}
      RetentionInDays: 30

  ReportsSummaryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ScatterPilot-ReportsSummary-${Environment}
      RetentionInDays: 30

# =============================================================================
# OUTPUTS
# =============================================================================
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${ScatterPilotApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub ScatterPilot-API-URL-${Environment}

  ConversationsTableName:
    Description: DynamoDB Conversations table
    Value: !Ref ConversationsTable
    Export:
      Name: !Sub ScatterPilot-Conversations-Table-${Environment}

  InvoicesTableName:
    Description: DynamoDB Invoices table
    Value: !Ref InvoicesTable
    Export:
      Name: !Sub ScatterPilot-Invoices-Table-${Environment}

  SubscriptionsTableName:
    Description: DynamoDB Subscriptions table
    Value: !Ref SubscriptionsTable
    Export:
      Name: !Sub ScatterPilot-Subscriptions-Table-${Environment}

  InvoiceBucketName:
    Description: S3 bucket for invoice PDFs
    Value: !Ref InvoiceBucket
    Export:
      Name: !Sub ScatterPilot-Invoice-Bucket-${Environment}

  ConversationFunctionArn:
    Description: Conversation Lambda Function ARN
    Value: !GetAtt ConversationFunction.Arn
    Export:
      Name: !Sub ScatterPilot-Conversation-Function-${Environment}

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref ScatterPilotUserPool
    Export:
      Name: !Sub ScatterPilot-UserPool-${Environment}

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref ScatterPilotUserPoolClient
    Export:
      Name: !Sub ScatterPilot-UserPoolClient-${Environment}

  UserPoolArn:
    Description: Cognito User Pool ARN
    Value: !GetAtt ScatterPilotUserPool.Arn
    Export:
      Name: !Sub ScatterPilot-UserPoolArn-${Environment}
