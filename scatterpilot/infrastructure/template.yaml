            TableName: !Ref SubscriptionsTable
      Events:
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /profile
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # Update User Profile
  UpdateUserProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-UpdateProfile-${Environment}
      CodeUri: ../functions/profile/
      Handler: update_profile.handler
      Description: Updates user profile and business information
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
      Events:
        UpdateProfile:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /profile
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer

  # ---------------------------------------------------------------------------
  # Stripe Connect Functions
  # ---------------------------------------------------------------------------

  # Get Stripe Connection Status
  GetStripeStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-GetStripeStatus-${Environment}
      CodeUri: ../functions/stripe/
      Handler: get_stripe_status.lambda_handler
      Description: Gets user's Stripe connection status
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SubscriptionsTable
      Events:
        GetStripeStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /stripe/status
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # Stripe OAuth Callback Handler
  StripeOAuthCallbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-StripeOAuthCallback-${Environment}
      CodeUri: ../functions/stripe/
      Handler: stripe_oauth_callback.lambda_handler
      Description: Handles Stripe OAuth callback and stores credentials
      Timeout: 60
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          STRIPE_CLIENT_ID: !Ref StripeClientId
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
      Events:
        StripeCallback:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /stripe/callback
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # Disconnect Stripe Account
  DisconnectStripeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-DisconnectStripe-${Environment}
      CodeUri: ../functions/stripe/
      Handler: disconnect_stripe.lambda_handler
      Description: Disconnects user's Stripe account
      Timeout: 60
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          STRIPE_CLIENT_ID: !Ref StripeClientId
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
      Events:
        DisconnectStripe:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /stripe/disconnect
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # Create Payment Link for Invoice
  CreatePaymentLinkFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-CreatePaymentLink-${Environment}
      CodeUri: ../functions/stripe/
      Handler: create_payment_link.handler
      Description: Creates Stripe payment link for invoice using connected account
      Timeout: 60
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          FRONTEND_URL: !Ref FrontendUrl
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref InvoicesTable
        - DynamoDBWritePolicy:
            TableName: !Ref InvoicesTable
        - DynamoDBReadPolicy:
            TableName: !Ref SubscriptionsTable
      Events:
        CreatePaymentLink:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /stripe/create-payment-link
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # Create Checkout Session for Invoice Payment
  CreateCheckoutSessionInvoiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-CreateInvoiceCheckout-${Environment}
      CodeUri: ../functions/invoices/
      Handler: create_checkout_session.handler
      Description: Creates a Stripe Checkout Session for paying an invoice
      Timeout: 60
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          FRONTEND_URL: !Ref FrontendUrl
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref InvoicesTable
        - DynamoDBWritePolicy:
            TableName: !Ref InvoicesTable
        - DynamoDBReadPolicy:
            TableName: !Ref SubscriptionsTable
      Events:
        CreateInvoicePaymentLink:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /invoices/{invoice_id}/payment-link
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # Get Public Invoice Data (no auth — for client-facing payment page)
  GetPublicInvoiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-GetPublicInvoice-${Environment}
      CodeUri: ../functions/invoices/
      Handler: get_public.handler
      Description: Returns public invoice data for the client-facing payment page
      Timeout: 15
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref InvoicesTable
        - DynamoDBReadPolicy:
            TableName: !Ref SubscriptionsTable
      Events:
        GetPublicInvoice:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /invoices/{invoice_id}/public
            Method: GET
            # No Cognito auth — public endpoint for invoice recipients

  # Public Checkout Session (no auth — called by invoice recipient from /pay/:id)
  PublicCheckoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-PublicCheckout-${Environment}
      CodeUri: ../functions/invoices/
      Handler: public_checkout.handler
      Description: Creates a Stripe Checkout Session for the public invoice payment page
      Timeout: 60
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          FRONTEND_URL: !Ref FrontendUrl
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref InvoicesTable
        - DynamoDBWritePolicy:
            TableName: !Ref InvoicesTable
        - DynamoDBReadPolicy:
            TableName: !Ref SubscriptionsTable
      Events:
        PublicCheckout:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /invoices/{invoice_id}/public-checkout
            Method: POST
            # No Cognito auth — public endpoint for invoice recipients

  # Payment Webhook Handler (Stripe Connect)
  PaymentWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-PaymentWebhook-${Environment}
      CodeUri: ../functions/stripe/
      Handler: payment_webhook.handler
      Description: Handles Stripe Connect payment webhook events
      Timeout: 60
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_PAYMENT_WEBHOOK_SECRET: !Ref StripePaymentWebhookSecret
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref InvoicesTable
        - DynamoDBWritePolicy:
            TableName: !Ref InvoicesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
      Events:
        PaymentWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /stripe/payment-webhook
            Method: POST
            # No Cognito auth - Stripe signature validation instead

  # ---------------------------------------------------------------------------
  # Stripe Connect Standard Account Functions
  # ---------------------------------------------------------------------------

  # Create Standard Connected Account & return onboarding URL
  StripeConnectAccountFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-StripeConnectAccount-${Environment}
      CodeUri: ../functions/stripe/
      Handler: connect_account.handler
      Description: Creates a Stripe Standard connected account and returns Account Link URL
      Timeout: 60
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          FRONTEND_URL: !Ref FrontendUrl
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
      Events:
        StripeConnectAccount:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /stripe/connect/account
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # Get Standard Connected Account Status
  StripeConnectStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-StripeConnectStatus-${Environment}
      CodeUri: ../functions/stripe/
      Handler: connect_status.handler
      Description: Returns live status of user's Stripe Standard connected account
      Timeout: 30
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          FRONTEND_URL: !Ref FrontendUrl
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
      Events:
        StripeConnectStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /stripe/connect/status
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # Get Stripe Dashboard Link (Standard accounts)
  StripeConnectDashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-StripeConnectDashboard-${Environment}
      CodeUri: ../functions/stripe/
      Handler: connect_dashboard.handler
      Description: Returns Stripe dashboard URL for Standard connected account
      Timeout: 15
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SubscriptionsTable
      Events:
        StripeConnectDashboard:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /stripe/connect/dashboard-link
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # ---------------------------------------------------------------------------
  # Billing — ScatterPilot Platform Subscriptions (Solo / Pro / Agency)
  # Separate from Stripe Connect (invoice→client payment flow)
  # ---------------------------------------------------------------------------

  # POST /billing/checkout — create a Stripe Checkout Session for a plan
  BillingCheckoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-BillingCheckout-${Environment}
      CodeUri: ../functions/billing/
      Handler: checkout.handler
      Description: Creates Stripe Checkout Session for Solo/Pro/Agency subscription
      Timeout: 60
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
      Events:
        BillingCheckout:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /billing/checkout
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # GET /billing/status — return subscription/trial status for the current user
  BillingStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-BillingStatus-${Environment}
      CodeUri: ../functions/billing/
      Handler: status.handler
      Description: Returns subscription and trial status for the authenticated user
      Timeout: 15
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
      Events:
        BillingStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /billing/status
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # POST /billing/portal — create a Stripe Customer Portal session
  BillingPortalFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-BillingPortal-${Environment}
      CodeUri: ../functions/billing/
      Handler: portal.handler
      Description: Creates Stripe Customer Portal session for subscription management
      Timeout: 30
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SubscriptionsTable
      Events:
        BillingPortal:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /billing/portal
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # ---------------------------------------------------------------------------
  # Feedback System
  # ---------------------------------------------------------------------------

  # Submit Feedback Function
  SubmitFeedbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-SubmitFeedback-${Environment}
      CodeUri: ../functions/feedback/
      Handler: submit.handler
      Description: Handles user feedback and bug reports
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          NOTIFICATION_EMAIL: dev@scatterpilot.com
          SENDER_EMAIL: noreply@scatterpilot.com
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FeedbackTable
        - DynamoDBReadPolicy:
            TableName: !Ref SubscriptionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref RateLimitsTable
        - DynamoDBWritePolicy:
            TableName: !Ref RateLimitsTable
        - Statement:
            - Sid: SESEmailSending
              Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
      Events:
        SubmitFeedback:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /feedback
            Method: POST
            # No auth required - allow anonymous feedback

  # ---------------------------------------------------------------------------
  # Daily Stats Digest (scheduled)
  # ---------------------------------------------------------------------------
  DailyDigestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-DailyDigest-${Environment}
      CodeUri: ../functions/analytics/
      Handler: daily_digest.handler
      Description: Sends a daily business metrics digest email at 8 AM ET
      Timeout: 30
      MemorySize: 256
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          DIGEST_RECIPIENT: ale@scatterpilot.com
          SES_SENDER: ale@scatterpilot.com
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SubscriptionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref InvoicesTable
        - Statement:
            - Sid: SESDigestSend
              Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 12 * * ? *)
            Description: Daily at 12:00 UTC (8:00 AM ET)
            Enabled: true

  # ---------------------------------------------------------------------------
  # Marketing Task Scheduler (scheduled)
  # ---------------------------------------------------------------------------
  MarketingTasksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-MarketingTasks-${Environment}
      CodeUri: ../functions/analytics/
      Handler: marketing_tasks.handler
      Description: Emails daily marketing action items at 7 AM ET from the content calendar
      Timeout: 15
      MemorySize: 128
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          DIGEST_RECIPIENT: ale@scatterpilot.com
          SES_SENDER: ale@scatterpilot.com
      Policies:
        - Statement:
            - Sid: SESMarketingTasksSend
              Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
      Events:
        MarketingTasksSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 11 * * ? *)
            Description: Daily at 11:00 UTC (7:00 AM ET)
            Enabled: true

  # ---------------------------------------------------------------------------
  # Cognito CustomMessage trigger — branded emails via Resend
  # ---------------------------------------------------------------------------
  CustomMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-CustomMessage-${Environment}
      CodeUri: ../functions/auth/
      Handler: custom_message.handler
      Description: Cognito CustomMessage trigger — sends branded verification and password reset emails via Resend
      Timeout: 10
      MemorySize: 128
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          RESEND_API_KEY: !Ref ResendApiKey
          RESEND_SENDER: authenticate@scatterpilot.com

  CustomMessageInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt CustomMessageFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*

  # ---------------------------------------------------------------------------
  # Cognito Custom Email Sender (Resend)
  # ---------------------------------------------------------------------------
  ResendEmailSenderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-ResendEmailSender-${Environment}
      CodeUri: ../functions/resend_email_sender/
      Handler: handler.handler
      Description: Cognito CustomEmailSender trigger — branded verification and password reset emails via Resend
      Timeout: 30
      MemorySize: 256
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          RESEND_API_KEY: !Ref ResendApiKey
          RESEND_SENDER: authenticate@scatterpilot.com
      Policies:
        - Statement:
            - Sid: GetResendApiKey
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub arn:aws:secretsmanager:us-east-1:${AWS::AccountId}:secret:resend-api-key*
            - Sid: DecryptCognitoCode
              Effect: Allow
              Action:
                - kms:Decrypt
              Resource: !GetAtt CognitoEmailSenderKmsKey.Arn

  ResendEmailSenderCognitoPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt ResendEmailSenderFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*

  ResendEmailSenderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ScatterPilot-ResendEmailSender-${Environment}
      RetentionInDays: 30

  # ---------------------------------------------------------------------------
  # API Gateway
  # ---------------------------------------------------------------------------
  ScatterPilotApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub ScatterPilot-API-${Environment}
      StageName: !Ref Environment
      TracingEnabled: true
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
        MaxAge: "'600'"
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt ScatterPilotUserPool.Arn
            Identity:
              Header: Authorization
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"

