AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ScatterPilot - Enterprise-grade serverless invoice generation system

# =============================================================================
# GLOBAL CONFIGURATION
# =============================================================================
Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
    Tracing: Active  # X-Ray tracing enabled
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: scatterpilot
        POWERTOOLS_METRICS_NAMESPACE: ScatterPilot
        LOG_LEVEL: INFO
        CONVERSATIONS_TABLE: !Ref ConversationsTable
        INVOICES_TABLE: !Ref InvoicesTable
        RATE_LIMITS_TABLE: !Ref RateLimitsTable
        SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTable
        FEEDBACK_TABLE: !Ref FeedbackTable
        INVOICE_BUCKET: !Ref InvoiceBucket
        RATE_LIMIT_MAX_REQUESTS: 100
        RATE_LIMIT_WINDOW_SECONDS: 3600
        # Stripe — available to all Lambda functions; Stripe-specific functions
        # use these directly, others can safely ignore them.
        STRIPE_SECRET_KEY: !Ref StripeSecretKey
        STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
        FRONTEND_URL: !Ref FrontendUrl
        # Stripe Billing price IDs (Solo / Pro / Agency, monthly + annual)
        # TODO: Replace placeholder values with real Stripe Price IDs after
        #       creating products/prices in the Stripe Dashboard.
        STRIPE_PRICE_SOLO_MONTHLY: !Ref StripePriceSoloMonthly
        STRIPE_PRICE_SOLO_ANNUAL: !Ref StripePriceSoloAnnual
        STRIPE_PRICE_PRO_MONTHLY: !Ref StripePriceProMonthly
        STRIPE_PRICE_PRO_ANNUAL: !Ref StripePriceProAnnual
        STRIPE_PRICE_AGENCY_MONTHLY: !Ref StripePriceAgencyMonthly
        STRIPE_PRICE_AGENCY_ANNUAL: !Ref StripePriceAgencyAnnual

# =============================================================================
# PARAMETERS
# =============================================================================
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment

  # TODO (manual deployment steps):
  #   1. StripeSecretKey     — set to sk_test_... (test) or sk_live_... (prod) via SSM or sam deploy --parameter-overrides
  #   2. StripeClientId      — set to your Stripe Connect Client ID (ca_...) from dashboard.stripe.com/settings/connect
  #   3. StripeWebhookSecret — after deploying, register the /stripe/webhook URL in Stripe dashboard,
  #                            then set the whsec_... signing secret here
  #   4. StripePaymentWebhookSecret — register the /stripe/payment-webhook URL for Connect events
  #                                   (event types: checkout.session.completed, payment_intent.succeeded,
  #                                    account.updated), then set the whsec_... signing secret here
  #   5. StripeProPriceId    — create a recurring price in Stripe and paste the price_... ID here
  #   6. FrontendUrl         — must match the exact origin used in CORS and Stripe redirect URLs
  StripeSecretKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: Stripe Secret API Key (sk_test_... or sk_live_...)

  StripeClientId:
    Type: String
    Default: 'ca_TTES0zNbc9MQ9hJIeYvD65yUc08qLqEb'
    Description: Stripe Connect Client ID (ca_...)

  StripeWebhookSecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: Stripe Webhook Signing Secret for subscription events (whsec_...)

  StripePaymentWebhookSecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: Stripe Webhook Signing Secret for Connect payment events (whsec_...)

  StripeProPriceId:
    Type: String
    Default: ''
    Description: Stripe Price ID for legacy Pro subscription (single-tier)

  # TODO: Create products and prices in the Stripe Dashboard, then replace these
  #       placeholder values with the real price_... IDs before deploying to prod.
  #       Pricing: Solo $29/mo $290/yr | Pro $49/mo $490/yr | Agency $99/mo $990/yr
  StripePriceSoloMonthly:
    Type: String
    Default: 'price_solo_monthly_TODO'
    Description: Stripe Price ID — Solo plan, monthly ($29/mo)

  StripePriceSoloAnnual:
    Type: String
    Default: 'price_solo_annual_TODO'
    Description: Stripe Price ID — Solo plan, annual ($290/yr)

  StripePriceProMonthly:
    Type: String
    Default: 'price_pro_monthly_TODO'
    Description: Stripe Price ID — Pro plan, monthly ($49/mo)

  StripePriceProAnnual:
    Type: String
    Default: 'price_pro_annual_TODO'
    Description: Stripe Price ID — Pro plan, annual ($490/yr)

  StripePriceAgencyMonthly:
    Type: String
    Default: 'price_agency_monthly_TODO'
    Description: Stripe Price ID — Agency plan, monthly ($99/mo)

  StripePriceAgencyAnnual:
    Type: String
    Default: 'price_agency_annual_TODO'
    Description: Stripe Price ID — Agency plan, annual ($990/yr)

  FrontendUrl:
    Type: String
    Default: 'https://scatterpilot.com'
    Description: Frontend URL for redirects and Stripe success/cancel URLs

  ResendApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: Resend API key for transactional email (re_...)

# =============================================================================
# RESOURCES
# =============================================================================
Resources:

  # ---------------------------------------------------------------------------
  # Lambda Layer - Shared Dependencies
  # ---------------------------------------------------------------------------
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: scatterpilot-common
      Description: Shared utilities and dependencies
      ContentUri: ../layers/common/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: python3.12

  # ---------------------------------------------------------------------------
  # DynamoDB Tables
  # ---------------------------------------------------------------------------
  ConversationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ScatterPilot-Conversations-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: conversation_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: conversation_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: ScatterPilot

  InvoicesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ScatterPilot-Invoices-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: invoice_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: invoice_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: ScatterPilot

  RateLimitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ScatterPilot-RateLimits-${Environment}
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: ScatterPilot

  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ScatterPilot-Subscriptions-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: stripe_customer_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StripeCustomerIndex
          KeySchema:
            - AttributeName: stripe_customer_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: ScatterPilot

  FeedbackTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ScatterPilot-Feedback-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: feedback_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
        - AttributeName: user_email
          AttributeType: S
      KeySchema:
        - AttributeName: feedback_id
          KeyType: HASH
        - AttributeName: created_at
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: user_email
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: ScatterPilot

  ScatterPilotMainTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ScatterPilot-Main-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: ScatterPilot

  # ---------------------------------------------------------------------------
  # S3 Bucket for PDFs
  # ---------------------------------------------------------------------------
  InvoiceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub scatterpilot-invoices-${Environment}-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false  # Allow bucket policy for public read
        IgnorePublicAcls: true
        RestrictPublicBuckets: false  # Allow public access via bucket policy
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: ScatterPilot

  # S3 Bucket Policy - Allow public read access to invoice PDFs
  InvoiceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref InvoiceBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadForInvoicePDFs
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub '${InvoiceBucket.Arn}/invoices/*'

  # ---------------------------------------------------------------------------
  # KMS Key for Cognito Custom Email Sender
  # ---------------------------------------------------------------------------
  CognitoEmailSenderKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for Cognito custom email sender code encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootAccount
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: AllowCognitoEncrypt
            Effect: Allow
            Principal:
              Service: cognito-idp.amazonaws.com
            Action:
              - kms:GenerateDataKey
              - kms:Encrypt
            Resource: '*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: ScatterPilot

  CognitoEmailSenderKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/scatterpilot-cognito-email-${Environment}
      TargetKeyId: !Ref CognitoEmailSenderKmsKey

  # ---------------------------------------------------------------------------
  # Cognito User Pool for Authentication
  # ---------------------------------------------------------------------------
  # ============================================================
  # CRITICAL: DO NOT CHANGE EmailSendingAccount
  # Must stay as COGNITO_DEFAULT.
  # We use a CustomEmailSender Lambda trigger (ResendEmailSenderFunction)
  # to send branded emails via Resend. Changing this to DEVELOPER
  # breaks the entire deploy and has caused multiple rollbacks.
  # DO NOT change EmailSendingAccount to DEVELOPER under any circumstances.
  # ============================================================
  ScatterPilotUserPool:
    Type: AWS::Cognito::UserPool
    DependsOn: ResendEmailSenderFunction
    Properties:
      UserPoolName: !Sub ScatterPilot-Users-${Environment}
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      UserPoolAddOns:
        AdvancedSecurityMode: ENFORCED
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      LambdaConfig:
        CustomEmailSender:
          LambdaArn: !GetAtt ResendEmailSenderFunction.Arn
          LambdaVersion: V1_0
        KMSKeyID: !GetAtt CognitoEmailSenderKmsKey.Arn
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      UserPoolTags:
        Environment: !Ref Environment
        Application: ScatterPilot

  ScatterPilotUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ScatterPilot-WebApp-${Environment}
      UserPoolId: !Ref ScatterPilotUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      PreventUserExistenceErrors: ENABLED
      RefreshTokenValidity: 30
      AccessTokenValidity: 60
      IdTokenValidity: 60
      TokenValidityUnits:
        RefreshToken: days
        AccessToken: minutes
        IdToken: minutes
      ReadAttributes:
        - email
        - email_verified
      WriteAttributes:
        - email

  # ---------------------------------------------------------------------------
  # Lambda Functions
  # ---------------------------------------------------------------------------

  # Bedrock Conversation Handler
  ConversationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-Conversation-${Environment}
      CodeUri: ../functions/bedrock/
      Handler: conversation.handler
      Description: Handles conversational invoice data extraction using Bedrock
      Policies:
        - Statement:
            - Sid: BedrockAccessMVP
              Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - arn:aws:bedrock:*::foundation-model/anthropic.claude-*
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref InvoicesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
      Timeout: 60
      MemorySize: 1024
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          BEDROCK_MODEL_ID: us.anthropic.claude-sonnet-4-6
      Events:
        PostMessage:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /conversation
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # List Conversations Function
  ListConversationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-ListConversations-${Environment}
      CodeUri: ../functions/conversations/
      Handler: list.handler
      Description: Lists user conversations with pagination
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ConversationsTable
      Events:
        ListConversations:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /conversations
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # Get Conversation Function
  GetConversationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-GetConversation-${Environment}
      CodeUri: ../functions/conversations/
      Handler: get.handler
      Description: Gets a single conversation with full message history
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ConversationsTable
      Events:
        GetConversation:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /conversations/{conversation_id}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # Delete Conversation Function
  DeleteConversationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-DeleteConversation-${Environment}
      CodeUri: ../functions/conversations/
      Handler: delete.handler
      Description: Deletes a conversation owned by the authenticated user
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
      Events:
        DeleteConversation:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /conversations/{conversation_id}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer

  # Update Customer Profile Function
  UpdateCustomerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-UpdateCustomer-${Environment}
      CodeUri: ../functions/customers/
      Handler: update.handler
      Description: Stores customer profile metadata (phone, notes) in subscriptions table
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
      Events:
        UpdateCustomer:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /customers/{customer_name}
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer

  # List Customers Function
  ListCustomersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-ListCustomers-${Environment}
      CodeUri: ../functions/customers/
      Handler: list.handler
      Description: Aggregates unique customers from invoices and conversations
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref InvoicesTable
        - DynamoDBReadPolicy:
            TableName: !Ref ConversationsTable
      Events:
        ListCustomers:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /customers
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # Create Invoice Function
  CreateInvoiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-CreateInvoice-${Environment}
      CodeUri: ../functions/invoices/
      Handler: create.handler
      Description: Creates invoice from conversation or direct data
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref InvoicesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
      Events:
        CreateInvoice:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /invoices
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # List Invoices Function
  ListInvoicesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-ListInvoices-${Environment}
      CodeUri: ../functions/invoices/
      Handler: list.handler
      Description: Lists user invoices with pagination
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref InvoicesTable
      Events:
        ListInvoices:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /invoices
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # Update Invoice Function
  UpdateInvoiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-UpdateInvoice-${Environment}
      CodeUri: ../functions/invoices/
      Handler: update.handler
      Description: Updates invoice status and/or content fields
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InvoicesTable
      Events:
        UpdateInvoice:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /invoices/{invoice_id}
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer

  # Get Invoice Function
  GetInvoiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-GetInvoice-${Environment}
      CodeUri: ../functions/invoices/
      Handler: get.handler
      Description: Retrieves single invoice by ID
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref InvoicesTable
      Events:
        GetInvoice:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /invoices/{invoice_id}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # Reports Summary Function
  ReportsSummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-ReportsSummary-${Environment}
      CodeUri: ../functions/invoices/
      Handler: reports.handler
      Description: Returns aggregated invoice analytics. Gated to Pro/Agency plans.
      Layers:
        - !Ref CommonLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref InvoicesTable
        - DynamoDBReadPolicy:
            TableName: !Ref SubscriptionsTable
      Events:
        GetReportsSummary:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /reports/summary
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # Generate PDF Function
  GeneratePDFFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-GeneratePDF-${Environment}
      CodeUri: ../functions/pdf/
      Handler: generate.handler
      Description: Generates PDF invoice and uploads to S3
      Timeout: 90
      MemorySize: 1536
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          INVOICE_BUCKET: !Ref InvoiceBucket
          INVOICES_TABLE: !Ref InvoicesTable
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref InvoicesTable
        - DynamoDBWritePolicy:
            TableName: !Ref InvoicesTable
        - DynamoDBReadPolicy:
            TableName: !Ref SubscriptionsTable
        - S3FullAccessPolicy:
            BucketName: !Ref InvoiceBucket
      Events:
        GeneratePDF:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /invoices/{invoice_id}/pdf
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # ---------------------------------------------------------------------------
  # Stripe Subscription Functions
  # ---------------------------------------------------------------------------

  # Create Checkout Session
  CreateCheckoutSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-CreateCheckout-${Environment}
      CodeUri: ../functions/subscriptions/
      Handler: checkout.handler
      Description: Creates Stripe checkout session for subscription
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_PRO_PRICE_ID: !Ref StripeProPriceId
          FRONTEND_URL: !Ref FrontendUrl
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
      Events:
        CreateCheckout:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /checkout
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # Create Portal Session
  CreatePortalSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ScatterPilot-CreatePortal-${Environment}
      CodeUri: ../functions/subscriptions/
      Handler: checkout.create_portal_session
      Description: Creates Stripe customer portal session
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          FRONTEND_URL: !Ref FrontendUrl
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SubscriptionsTable
      Events:
        CreatePortal:
          Type: Api
          Properties:
            RestApiId: !Ref ScatterPilotApi
            Path: /portal
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # Get Subscription
  GetSubscriptionFunction:
